name: Personal build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-app:
    name: Build unsigned macOS app
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CMUX_DEV_BACKEND_MODE: local
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Setup (pinned Rust, prebuilt GhosttyKit)
        run: ./scripts/setup.sh

      - name: Fetch Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build tagged Debug app
        run: |
          set -euo pipefail
          ./scripts/reload.sh --tag ci-fix

      - name: Zip app
        run: |
          set -euo pipefail
          APP_DIR="$HOME/Library/Developer/Xcode/DerivedData/cmux-ci-fix/Build/Products/Debug"
          APP_PATH="$APP_DIR/cmux DEV ci-fix.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "app not found at $APP_PATH"; ls -R "$APP_DIR" || true; exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/cmux-ci-fix.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmux-debug-ci-fix
          path: ${{ runner.temp }}/cmux-ci-fix.zip
          retention-days: 14
