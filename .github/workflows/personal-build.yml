name: Personal build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-app:
    name: Build unsigned macOS app
    # Upstream forks also build on macos-26: the workspace needs Swift tools 6.2
    # (Xcode 26); macos-15's Xcode ships 6.1 and fails package resolution.
    runs-on: macos-26
    timeout-minutes: 150
    env:
      CMUX_DEV_BACKEND_MODE: local
      # Our squashed root commit has no upstream history, so the client-commit
      # resolver cannot find a published cmux-tui client. ef47931's cmux-tui
      # tree is byte-identical to ours, so pin its published manifest.
      CMUX_TUI_CLIENT_MANIFEST_URL: https://files.cmux.com/cmux-tui/ef4793126909076c23bf535ae5c661f8a29828a3/manifest.json
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Setup (pinned Rust, prebuilt GhosttyKit)
        run: ./scripts/setup.sh

      - name: Build tagged Debug app
        run: |
          set -euo pipefail
          ./scripts/reload.sh --tag ci-fix

      - name: Zip app
        run: |
          set -euo pipefail
          APP_DIR="$HOME/Library/Developer/Xcode/DerivedData/cmux-ci-fix/Build/Products/Debug"
          APP_PATH="$APP_DIR/cmux DEV ci-fix.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "app not found at $APP_PATH"; ls -R "$APP_DIR" || true; exit 1
          fi
          # Personal build: rename the app in the menu bar / About panel.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName 我个人专用的cmux' -c 'Set :CFBundleDisplayName 我个人专用的cmux' "$APP_PATH/Contents/Info.plist"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/cmux-ci-fix.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmux-debug-ci-fix
          path: ${{ runner.temp }}/cmux-ci-fix.zip
          retention-days: 14
